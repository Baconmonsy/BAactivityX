<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTOKO</title>
  <link rel="stylesheet" href="style.css">
  <style>

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      padding: 15px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .navbar h1 {
      margin: 0;
      font-size: 22px;
      color: #38bdf8;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .main-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    .menu-section h2, .cart-section h2 {
      margin-top: 0;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      color: #38bdf8;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .menu-card {
      background: rgba(30, 41, 59, 0.85);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .menu-card h3 {
      margin: 10px 0 5px 0;
      font-size: 16px;
      color: #fff;
    }

    .price {
      color: #4ade80;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .cart-section {
      background: rgba(30, 41, 59, 0.85);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      height: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
      color: #94a3b8;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      text-align: right;
      color: #fff;
    }
  </style>
</head>
<body class="dashboard-page">

  <div class="navbar">
    <h1>🍕 RESTOKO</h1>
    <div class="user-info">
      <span id="userGreeting">Welcome!</span>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="main-container">
    
    <div class="menu-section">
      <h2>Menu</h2>
      <div class="menu-grid" id="menuGrid">
      </div>
    </div>

    <div class="cart-section">
      <h2>Your Order</h2>
      <div id="cartItems">
        <p style="color: #94a3b8;">Your cart is empty.</p>
      </div>
      <div class="total">Total: ₱<span id="totalPrice">0</span></div>
      <button style="margin-top: 15px;" onclick="checkout()">Checkout Order</button>
    </div>

  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    if (!currentUser) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('userGreeting').textContent = `Hello, ${currentUser.username}!`;
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    }

    const menuItems = [
      { 
        id: 1, 
        name: "Cheesy Burger", 
        price: 120, 
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80" 
      },
      { 
        id: 2, 
        name: "Pepperoni Pizza", 
        price: 350, 
        image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=400&q=80" 
      },
      { 
        id: 3, 
        name: "Spaghetti Pasta", 
        price: 150, 
        image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=80" 
      },
      { 
        id: 4, 
        name: "Fried Chicken", 
        price: 180, 
        image: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=400&q=80" 
      },
      { 
        id: 5, 
        name: "Crispy Fries", 
        price: 80, 
        image: "https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?auto=format&fit=crop&w=400&q=80" 
      },
      { 
        id: 6, 
        name: "Iced Tea", 
        price: 50, 
        image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=400&q=80" 
      }
    ];

    let cart = [];

    const menuGrid = document.getElementById('menuGrid');
    menuItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'menu-card';
      card.innerHTML = `
        <img src="${item.image}" alt="${item.name}" class="menu-img">
        <h3>${item.name}</h3>
        <div class="price">₱${item.price}</div>
        <button onclick="addToCart(${item.id})">Add to Order</button>
      `;
      menuGrid.appendChild(card);
    });

    function addToCart(id) {
      const item = menuItems.find(m => m.id === id);
      cart.push(item);
      updateCart();
    }

    function updateCart() {
      const cartContainer = document.getElementById('cartItems');
      const totalPriceEl = document.getElementById('totalPrice');

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: #94a3b8;">Your cart is empty.</p>';
        totalPriceEl.textContent = '0';
        return;
      }

      cartContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item) => {
        total += item.price;
        const cartItem = document.createElement('div');
        cartItem.className = 'cart-item';
        cartItem.innerHTML = `
          <span>${item.name}</span>
          <span>₱${item.price}</span>
        `;
        cartContainer.appendChild(cartItem);
      });

      totalPriceEl.textContent = total;
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Please add items to your cart first!");
        return;
      }
      alert(`Thank you for your order, ${currentUser.username}! Total is ₱${document.getElementById('totalPrice').textContent}.`);
      cart = [];
      updateCart();
    }
  </script>
</body>
</html>
